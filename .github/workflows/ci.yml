name: CI - Tests & Sanity

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  secrets-scan:
    name: Automated Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Run Gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.24.0 git --log-opts="--all" --redact -v .

  test:
    name: Run BDD & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run BDD Test Suite (Godog)
        run: go test -v -count=1 ./tests/bdd

      - name: Run All Tests
        run: go test -v -count=1 ./...

      - name: Compile Bot Binary
        run: go build -v -ldflags="-w -s" ./cmd/bot
