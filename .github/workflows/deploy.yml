name: CD - Deploy to GCP Cloud Run

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run BDD Test Suite
        run: go test -v -count=1 ./tests/bdd

      - name: Run All Tests
        run: go test -v -count=1 ./...

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/471922888147/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'github-deployer@project-63ecb925-668f-4dff-8d5.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}

      - name: Enable GCP Services
        run: |
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            cloudscheduler.googleapis.com \
            --project "${{ secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}"

      - name: Deploy to Cloud Run (Free Tier Guardrails)
        id: deploy
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'moex-bonds-bot' }}
          REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
        run: |
          echo "Deploying $SERVICE_NAME to region $REGION under GCP Free Tier ($0.00/mo)..."
          
          ENV_VARS=""
          if [ -n "$SECRET_TOKEN" ]; then
            ENV_VARS="TELEGRAM_SECRET_TOKEN=$SECRET_TOKEN"
          fi
          if [ -n "$BOT_TOKEN" ]; then
            if [ -n "$ENV_VARS" ]; then
              ENV_VARS="$ENV_VARS,TELEGRAM_BOT_TOKEN=$BOT_TOKEN"
            else
              ENV_VARS="TELEGRAM_BOT_TOKEN=$BOT_TOKEN"
            fi
          fi

          DEPLOY_CMD="gcloud run deploy $SERVICE_NAME \
            --source . \
            --project $PROJECT_ID \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --memory 128Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --timeout 15s"

          if [ -n "$ENV_VARS" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --set-env-vars $ENV_VARS"
          fi

          eval $DEPLOY_CMD

          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format "value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "Service deployed at: $SERVICE_URL"

      - name: Configure Telegram Webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "Registering Telegram webhook with secret token..."
            TG_RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"${{ env.SERVICE_URL }}/webhook\",\"secret_token\":\"${SECRET_TOKEN}\",\"drop_pending_updates\":true}")
            
            echo "Telegram response: $TG_RESP"
            if ! echo "$TG_RESP" | grep -q '"ok":true'; then
              echo "::warning ::Webhook registration returned non-ok response: $TG_RESP"
            fi
          else
            echo "TELEGRAM_BOT_TOKEN not provided, skipping webhook registration."
          fi

      - name: Configure Cloud Scheduler (06:00 UTC / 09:00 MSK)
        env:
          REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}
          SCHEDULER_JOB: "moex-daily-digest"
        run: |
          echo "Configuring Cloud Scheduler job..."
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --location "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_JOB" \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule="0 6 * * *" \
              --uri="${{ env.SERVICE_URL }}/cron/daily-digest" \
              --http-method=POST
            echo "Scheduler job updated."
          else
            gcloud scheduler jobs create http "$SCHEDULER_JOB" \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule="0 6 * * *" \
              --uri="${{ env.SERVICE_URL }}/cron/daily-digest" \
              --http-method=POST
            echo "Scheduler job created."
          fi

      - name: Verify Deployment (Healthz & Webhook Handshake)
        env:
          SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          chmod +x scripts/sanity_check.sh
          ./scripts/sanity_check.sh "${{ env.SERVICE_URL }}" "$SECRET_TOKEN" "$BOT_TOKEN"
