name: CD - Deploy to GCP Cloud Run

on:
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run BDD Test Suite
        run: go test -v -count=1 ./tests/bdd

      - name: Run All Tests
        run: go test -v -count=1 ./...

  deploy:
    name: Deploy to Google Cloud Run
    needs: test
    runs-on: ubuntu-latest
    environment: generic-env
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/471922888147/locations/global/workloadIdentityPools/github-pool/providers/github-provider' }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT || secrets.GCP_SERVICE_ACCOUNT || 'github-deployer@project-63ecb925-668f-4dff-8d5.iam.gserviceaccount.com' }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}

      - name: Deploy to Cloud Run (Free Tier Guardrails)
        id: deploy
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME || 'moex-bonds-bot' }}
          REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}
          RUNTIME_SA: ${{ vars.RUNTIME_SA || 'bot-runtime@project-63ecb925-668f-4dff-8d5.iam.gserviceaccount.com' }}
        run: |
          echo "Deploying $SERVICE_NAME to region $REGION under GCP Free Tier (\$0.00/mo)..."
          
          args=(run deploy "$SERVICE_NAME"
            --source .
            --project "$PROJECT_ID"
            --region "$REGION"
            --platform managed
            --no-allow-unauthenticated
            --memory 128Mi
            --cpu 1
            --min-instances 0
            --max-instances 2
            --concurrency 80
            --timeout 15s
            --service-account "$RUNTIME_SA"
            --set-secrets "TELEGRAM_BOT_TOKEN=telegram-bot-token:latest,TELEGRAM_SECRET_TOKEN=telegram-secret-token:latest")

          gcloud "${args[@]}"

          SERVICE_URL=$(gcloud run services describe "$SERVICE_NAME" --project "$PROJECT_ID" --region "$REGION" --format "value(status.url)")
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
          echo "Service deployed at: $SERVICE_URL"

      - name: Configure Telegram Webhook
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET_TOKEN: ${{ secrets.TELEGRAM_SECRET_TOKEN }}
          WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL || secrets.TELEGRAM_WEBHOOK_URL || 'https://holy-art-8543.lkane516.workers.dev/webhook' }}
        run: |
          if [ -n "$BOT_TOKEN" ]; then
            echo "Registering Telegram webhook pointing to edge proxy ($WEBHOOK_URL)..."
            TG_RESP=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/setWebhook" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"${WEBHOOK_URL}\",\"secret_token\":\"${SECRET_TOKEN}\",\"drop_pending_updates\":true,\"allowed_updates\":[\"message\"]}")
            
            echo "Telegram response: $TG_RESP"
            if ! echo "$TG_RESP" | grep -q '"ok":true'; then
              echo "::warning ::Webhook registration returned non-ok response: $TG_RESP"
            fi
          else
            echo "TELEGRAM_BOT_TOKEN not provided, skipping webhook registration."
          fi

      - name: Configure Cloud Scheduler (06:00 UTC / 09:00 MSK)
        env:
          REGION: ${{ vars.GCP_REGION || 'europe-west1' }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'project-63ecb925-668f-4dff-8d5' }}
          SCHEDULER_SA: ${{ vars.SCHEDULER_SA || 'scheduler-invoker@project-63ecb925-668f-4dff-8d5.iam.gserviceaccount.com' }}
          SCHEDULER_JOB: "moex-daily-digest"
        run: |
          echo "Configuring Cloud Scheduler job..."
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --location "$REGION" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_JOB" \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule="0 6 * * *" \
              --uri="${{ env.SERVICE_URL }}/cron/daily-digest" \
              --http-method=POST \
              --oidc-service-account-email="$SCHEDULER_SA" \
              --oidc-token-audience="${{ env.SERVICE_URL }}"
            echo "Scheduler job updated."
          else
            gcloud scheduler jobs create http "$SCHEDULER_JOB" \
              --location "$REGION" \
              --project "$PROJECT_ID" \
              --schedule="0 6 * * *" \
              --uri="${{ env.SERVICE_URL }}/cron/daily-digest" \
              --http-method=POST \
              --oidc-service-account-email="$SCHEDULER_SA" \
              --oidc-token-audience="${{ env.SERVICE_URL }}"
            echo "Scheduler job created."
          fi

      - name: Deployment Summary
        run: |
          echo "======================================================="
          echo "🎉 Deployment successfully completed!"
          echo "Service URL: ${{ env.SERVICE_URL }}"
          echo "======================================================="
